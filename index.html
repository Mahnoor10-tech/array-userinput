<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Analyzer</h1>

        <div class="card">

            <h2>Enter Student Information</h2>

            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

            <label for="english">English Marks</label>
            <input
                type="number"
                id="english"
                placeholder="Enter English marks"
                min="0"
                max="100"
            >

            <label for="math">Math Marks</label>
            <input
                type="number"
                id="math"
                placeholder="Enter Math marks"
                min="0"
                max="100"
            >

            <label for="science">Science Marks</label>
            <input
                type="number"
                id="science"
                placeholder="Enter Science marks"
                min="0"
                max="100"
            >

            <label for="computer">Computer Marks</label>
            <input
                type="number"
                id="computer"
                placeholder="Enter Computer marks"
                min="0"
                max="100"
            >

            <button id="calculateButton">
                Calculate Result
            </button>

        </div>

        <div class="card result-card">

            <h2>Student Result</h2>

            <p id="errorMessage"></p>
            <p id="resultName"></p>
            <p id="resultTotal"></p>
            <p id="resultAverage"></p>
            <p id="resultPercentage"></p>
            <p id="resultGrade"></p>
            <p id="resultStatus"></p>

        </div>

    </div>

    <script src="javascript.js"></script>

</body>

</html>
